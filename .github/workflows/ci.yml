name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Kiểm tra format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # build đã bao gồm `tsc -b`, nên đây cũng là bước typecheck
      - name: Typecheck + build
        run: npm run build
